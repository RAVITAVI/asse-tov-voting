<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>כנס קמפוס חמ"ד</title>
</head>
<body>

    <div id="opening-screen" class="screen active">
        <button id="adminBtn" class="admin-gear">⚙️</button>
        <img src="campus-hemad-logo.jpg" alt="לוגו קמפוס חמד" class="logo">
        <h1>ברוכים הבאים לכנס "עשה טוב"</h1>
        <p>כנס להצגת יוזמות של תלמידי קמפוס חמ"ד תשפ"ו</p>
        <button id="startBtn" class="start-btn">מתחילים</button>
    </div>

    <div id="gender-screen" class="screen">
        <div class="banner">
            <img src="campus-hemad-logo.jpg" class="logo-right">
            <img src="asse-tov-logo.PNG" class="logo-center">
            <span class="banner-text">קמפוס חמ"ד - תשפ"ו</span>
        </div>
        <div class="main-wrapper">
            <div class="card">
                <h2>האם את/ה:</h2>
                <div class="gender-buttons">
                    <button class="btn-gender btn-boy" id="boyBtn">בן</button>
                    <button class="btn-gender btn-girl" id="girlBtn">בת</button>
                </div>
            </div>
        </div>
    </div>

    <div id="school-screen" class="screen">
        <div class="banner">
            <img src="campus-hemad-logo.jpg" class="logo-right">
            <img src="asse-tov-logo.PNG" class="logo-center">
            <span class="banner-text">קמפוס חמ"ד - תשפ"ו</span>
        </div>
        <div class="main-wrapper">
            <div class="card">
                <h2 id="school-question"></h2>
                
                <select id="school-dropdown" class="school-select">
                    <option value="">בחר בית ספר...</option>
                </select>

                <button id="nextBtn" class="start-btn" style="margin-top: 25px; width: 100%;">המשך</button>
                <button id="backToGenderBtn" class="back-btn">↩️ חזור למסך הקודם</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
