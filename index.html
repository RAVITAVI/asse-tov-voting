<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>כנס קמפוס חמ"ד</title>
</head>
<body>

    <div id="opening-screen" class="screen active">
        <button id="adminBtn" class="admin-gear">⚙️</button>
        <img src="campus-hemad-logo.jpg" alt="לוגו קמפוס חמד" class="logo-square">
        <h1>ברוכים הבאים לכנס "עשה טוב"</h1>
        <p>כנס להצגת יוזמות של תלמידי קמפוס חמ"ד תשפ"ו</p>
        <button id="startBtn" class="start-btn">מתחילים</button>
    </div>

    <div id="gender-screen" class="screen">
        <div class="banner">
            <img src="campus-hemad-logo.jpg" class="logo-right">
            <img src="asse-tov-logo.PNG" class="logo-center">
            <span class="banner-text">קמפוס חמ"ד - תשפ"ו</span>
        </div>
        <div class="main-wrapper">
            <div class="card">
                <h2>האם את/ה:</h2>
                <div class="gender-buttons">
                    <button class="btn-gender btn-boy" id="boyBtn">בן</button>
                    <button class="btn-gender btn-girl" id="girlBtn">בת</button>
                </div>
            </div>
        </div>
    </div>

    <div id="school-screen" class="screen">
        <div class="banner">
            <img src="campus-hemad-logo.jpg" class="logo-right">
            <img src="asse-tov-logo.PNG" class="logo-center">
            <span class="banner-text">קמפוס חמ"ד - תשפ"ו</span>
        </div>
        <div class="main-wrapper">
            <div class="card">
                <h2 id="school-question"></h2>
                <select id="school-dropdown" class="school-select">
                    <option value="">בחר בית ספר...</option>
                </select>
                <button id="nextBtn" class="start-btn" style="margin-top: 25px; width: 100%;">המשך</button>
                <button id="backToGenderBtn" class="back-btn">↩️ חזור למסך הקודם</button>
            </div>
        </div>
    </div>

    <div id="name-screen" class="screen">
        <div class="banner">
            <img src="campus-hemad-logo.jpg" class="logo-right">
            <img src="asse-tov-logo.PNG" class="logo-center">
            <span class="banner-text">קמפוס חמ"ד - תשפ"ו</span>
        </div>
        <div class="main-wrapper">
            <div class="card">
                <h2 id="name-question">מה שמך המלא?</h2>
                <div class="autocomplete-wrapper">
                    <input type="text" id="student-name-input" class="name-input" placeholder="התחל/י להקליד את שמך..." autocomplete="off">
                    <div id="suggestions-container" class="suggestions-list"></div>
                </div>
                <button id="submitNameBtn" class="start-btn" style="margin-top: 25px; width: 100%;">המשך</button>
                <button id="backToSchoolBtn" class="back-btn">↩️ חזור למסך הקודם</button>
            </div>
        </div>
    </div>

    <div id="voting-screen" class="screen">
        <div class="projects-page-wrapper">
            <h2 class="page-title">בחירת היוזמה לדירוג</h2>
            <p class="page-subtitle">לחצו על המיזם כדי לדרג אותו:</p>
            <div id="projects-grid" class="projects-grid-container"></div>
            <button id="backToNameBtn" class="back-btn-voting">↩️ חזור למסך הקודם</button>
        </div>
    </div>

    <div id="rating-modal" class="modal-overlay">
        <div class="modal-card">
            <button id="modal-close-x" class="modal-close-x">✕</button>
            <div class="modal-header">
                <span id="modal-project-no" class="modal-badge"></span>
                <h3 id="modal-project-title"></h3>
            </div>
            <div class="modal-body">
                <p><strong>יזמים:</strong> <span id="modal-project-creators"></span></p>
                <p><strong>קורס:</strong> <span id="modal-project-course"></span></p>
                <div class="rating-range-wrapper">
                    <label>דרגו את המיזם:</label>
                    <div class="slider-val-display" id="slider-value-preview">לא דורג</div>
                    <input type="range" id="rating-slider" min="0" max="10" value="0" class="modern-slider">
                    <div class="slider-labels">
                        <span>ללא דירוג</span>
                        <span>5</span>
                        <span>10</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="modal-save-btn" class="modal-btn btn-save">שמור</button>
                <button id="modal-cancel-btn" class="modal-btn btn-cancel">ביטול</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
