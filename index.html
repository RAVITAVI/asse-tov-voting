<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>כנס עשה טוב</title>
</head>
<body>

    <div id="opening-screen" class="screen active">
        <button id="adminBtn" class="admin-gear">⚙️</button>
        <img src="campus-hemad-logo.jpg" alt="לוגו קמפוס חמד" class="logo">
        <h1>ברוכים הבאים לכנס "עשה טוב"</h1>
        <p>כנס להצגת יוזמות של תלמידי קמפוס חמ"ד תשפ"ו</p>
        <button id="startBtn" class="start-btn">מתחילים</button>
    </div>

    <div id="gender-screen" class="screen">
        <div class="banner">
            <img src="campus-hemad-logo.jpg" class="banner-logo-right">
            <img src="conference-logo.jpg" class="banner-logo-center">
            <span class="banner-text-left">קמפוס חמ"ד - תשפ"ו</span>
        </div>
        <div class="content">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
